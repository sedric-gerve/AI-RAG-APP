databases:
  - name: ai-rag-crm-db
    plan: free
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all (Render-managed connection is already restricted to this service)

services:
  - name: ai-rag-crm
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: "AI-RAG CRM"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: ai-rag-crm-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # Sync instead of database: the free tier has no separate worker
      # process, so embeddings are generated inline on save rather than
      # via a background queue. Documented tradeoff, see README.
      - key: QUEUE_CONNECTION
        value: sync
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_MODEL
        value: voyage-3.5
      - key: BACKFILL_TOKEN
        sync: false
